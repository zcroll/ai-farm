models:
  # The Disease model holds static information about each condition.
  Disease:
    id: id
    name: string:255,unique
    description: text
    treatment_suggestions: text
    source_url: string:255,nullable
    timestamps: true
  
  # The Scan model records each prediction event for a user.
  Scan:
    id: id
    image_path: string:25f5
    predicted_disease: string:255
    confidence: float:5,2
    timestamps: true
    relationships:
      belongsTo: User, Disease

  # Add the relationship to the existing User model.
  User:
    relationships:
      hasMany: Scan

# We want to seed the database with our list of diseases.
seeders:
  - Disease

controllers:
  # This controller handles the prediction logic.
  PredictionController:
    # The 'predict' method will be mapped to the API route.
    store:
      validate: image|required|max:2048
      store: image:scans
      dispatch: ProcessPrediction
      find: disease:name,request.predicted_disease
      save: scan:user_id,predicted_disease,confidence,image_path,disease_id
      return: scan.with:details

  # This controller prepares the data for the main dashboard view.
  DashboardController:
    index:
      query: all:scans by:user_id order:created_at:desc paginate:10
      return: inertia:Dashboard with:stats,history